<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dadu kayu: konsep yang sama dengan papan permainan. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c98a4b"/>
      <stop offset="1" stop-color="#8a5326"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f7ead0"/>
      <stop offset="1" stop-color="#dfc9a0"/>
    </linearGradient>
  </defs>

  <!-- Badan dadu -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#wood)"/>
  <!-- Muka kayu -->
  <rect x="8" y="8" width="48" height="48" rx="9" fill="url(#face)"/>
  <!-- Pip 5: pola yang sama dengan dadu di game -->
  <g fill="#6b4423">
    <circle cx="22" cy="22" r="4.4"/>
    <circle cx="42" cy="22" r="4.4"/>
    <circle cx="32" cy="32" r="4.4"/>
    <circle cx="22" cy="42" r="4.4"/>
    <circle cx="42" cy="42" r="4.4"/>
  </g>
</svg>
